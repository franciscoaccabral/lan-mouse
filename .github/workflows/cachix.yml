name: Nix Binary Cache

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
          - macos-latest
    name: "Build"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1
        with:
          name: lan-mouse
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build lan-mouse (x86_64-linux)
        if: matrix.os == 'ubuntu-latest'
        run: nix build --print-build-logs --show-trace .#packages.x86_64-linux.lan-mouse

      - name: Build lan-mouse (x86_64-darwin)
        if: matrix.os == 'macos-15-intel'
        run: nix build --print-build-logs --show-trace .#packages.x86_64-darwin.lan-mouse

      - name: Build lan-mouse (aarch64-darwin)
        if: matrix.os == 'macos-latest'
        run: nix build --print-build-logs --show-trace .#packages.aarch64-darwin.lan-mouse
